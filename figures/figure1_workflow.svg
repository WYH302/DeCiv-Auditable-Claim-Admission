  <text x="692" y="75" class="t b" font-size="18">Verifier</text>
  <text x="692" y="98" class="t b" font-size="18">Argmax</text>
  <line x1="768" y1="66" x2="812" y2="66" stroke="#1e293b" stroke-width="2.4" marker-end="url(#arr)"/>
